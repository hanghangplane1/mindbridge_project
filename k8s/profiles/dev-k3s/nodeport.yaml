apiVersion: v1
kind: Service
metadata:
  name: platform-nodeport
  namespace: mindbridge
spec:
  type: NodePort
  selector:
    app: platform
  ports:
  - name: http
    port: 8077
    targetPort: 8077
    nodePort: 30077
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: mindbridge
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    port: 5173
    targetPort: 5173
    nodePort: 30173
