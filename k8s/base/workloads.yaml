---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mindbridge
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mindbridge:platform-dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
          name: http
        env:
        - name: SERVICE_NAME
          value: frontend
        - name: MINDBRIDGE_FRONTEND_GATEWAY_URL
          value: http://gateway-svc:8090
        - name: MINDBRIDGE_FRONTEND_ORCHESTRATOR_URL
          value: http://orchestrator-svc:5009
        - name: MINDBRIDGE_FRONTEND_COUNSELOR_URL
          value: http://counselor-0.counselor-svc:5010
        - name: MINDBRIDGE_FRONTEND_EVALUATOR_URL
          value: http://evaluator-0.evaluator-svc:5011
