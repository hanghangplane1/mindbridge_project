apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counselor
  namespace: mindbridge
  labels:
    app: counselor
spec:
  serviceName: counselor-svc
  replicas: 2
  selector:
    matchLabels:
      app: counselor
  template:
    metadata:
      labels:
        app: counselor
    spec:
      containers:
      - name: counselor
        image: mindbridge:platform-dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5010
          name: http
        envFrom:
        - configMapRef:
            name: mindbridge-config
        - secretRef:
            name: mindbridge-secrets
            optional: true
        env:
        - name: SERVICE_NAME
          value: counselor
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5010
        volumeMounts:
        - name: counselor-data
          mountPath: /app/.mindbridge
        - name: run-artifacts
          mountPath: /app/.mindbridge/runs
      volumes:
      - name: run-artifacts
        persistentVolumeClaim:
          claimName: run-artifacts
  volumeClaimTemplates:
  - metadata:
      name: counselor-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
