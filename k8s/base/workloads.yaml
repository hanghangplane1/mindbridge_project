apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mindbridge
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: mindbridge:platform-dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        envFrom:
        - configMapRef:
            name: mindbridge-config
        - secretRef:
            name: mindbridge-secrets
            optional: true
        env:
        - name: SERVICE_NAME
          value: gateway
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8090
        volumeMounts:
        - name: run-artifacts
          mountPath: /app/.mindbridge/runs
      volumes:
      - name: run-artifacts
        persistentVolumeClaim:
          claimName: run-artifacts
---
