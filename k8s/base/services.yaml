apiVersion: v1
kind: Service
metadata:
  name: platform-svc
  namespace: mindbridge
spec:
  selector:
    app: platform
  ports:
  - name: http
    port: 8077
    targetPort: 8077
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: mindbridge
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8090
    targetPort: 8090
---
apiVersion: v1
kind: Service
