services:
  mindbridge_mysql:
    image: mysql:8.0
    container_name: mindbridge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MINDBRIDGE_MYSQL_ROOT_PASSWORD:-mindbridge}
      MYSQL_DATABASE: ${MINDBRIDGE_MYSQL_DATABASE:-mindbridge}
      MYSQL_USER: ${MINDBRIDGE_MYSQL_USER:-mindbridge}
      MYSQL_PASSWORD: ${MINDBRIDGE_MYSQL_PASSWORD:-mindbridge}
    ports:
      - "${MINDBRIDGE_MYSQL_PORT:-3307}:3306"
    volumes:
      - mindbridge_mysql_data:/var/lib/mysql
      - ../../mindbridge_harness/configs/cloud_storage_mysql.sql:/docker-entrypoint-initdb.d/001_mindbridge.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MINDBRIDGE_MYSQL_USER:-mindbridge}", "-p${MINDBRIDGE_MYSQL_PASSWORD:-mindbridge}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mindbridge_redis:
    image: redis:7-alpine
    container_name: mindbridge_redis
    restart: unless-stopped
    ports:
      - "${MINDBRIDGE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mindbridge_fastdfs:
    build:
      context: .
      dockerfile: fastdfs/Dockerfile
    container_name: mindbridge_fastdfs
    restart: unless-stopped
    ports:
      - "${MINDBRIDGE_FASTDFS_HTTP_PORT:-80}:80"
      - "${MINDBRIDGE_FASTDFS_HTTPS_PORT:-443}:443"
      - "${MINDBRIDGE_FASTDFS_TRACKER_PORT:-22122}:22122"
      - "${MINDBRIDGE_FASTDFS_STORAGE_PORT:-23000}:23000"
    volumes:
      - mindbridge_fastdfs_data:/fastdfs_data_and_log
    healthcheck:
      test: ["CMD-SHELL", "fdfs_monitor /etc/fdfs/client.conf >/dev/null 2>&1 && curl -fsS http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mindbridge_mysql_data:
  mindbridge_fastdfs_data:
