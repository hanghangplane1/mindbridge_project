# MindBridge C++：Nginx 统一入口模板
# 用法：将 MINDBRIDGE_GATEWAY_UPSTREAM 指到 mindbridge_gateway（默认 127.0.0.1:8090）
# 静态页可选指向仓库内任意 frontend 目录

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream mindbridge_gateway {
        least_conn;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
        server 127.0.0.1:8092;
    }

    server {
        listen 8088;
        server_name localhost;

        # 可选：本地静态页
        # root /usr/share/nginx/html;
        # location / { try_files $uri $uri/ /index.html; }

        location /api/health {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://mindbridge_gateway;
        }

        location /api/chat/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 600s;
            proxy_pass http://mindbridge_gateway/;
        }

        location /api/a2a/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://mindbridge_gateway/;
        }

        location /api/benchmark/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_pass http://mindbridge_gateway/;
        }

        # A2A / JSON-RPC 转发到 C++ gateway（再转下游 counselor）
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 600s;
            proxy_pass http://mindbridge_gateway;
        }
    }
}
